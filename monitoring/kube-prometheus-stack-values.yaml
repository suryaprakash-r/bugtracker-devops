# Keep cluster monitoring lightweight for this learning environment.
alertmanager:
  enabled: false

# EKS control-plane endpoints managed by AWS are not scraped as
# if they were self-managed Kubernetes control-plane components.
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

prometheusOperator:
  nodeSelector:
    kubernetes.io/hostname: ip-192-168-63-213.ap-south-1.compute.internal
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 24h
    retentionSize: "2GB"
    scrapeInterval: 30s
    evaluationInterval: 30s
    nodeSelector:
      kubernetes.io/hostname: ip-192-168-63-213.ap-south-1.compute.internal
    resources:
      requests:
        cpu: 150m
        memory: 350Mi
      limits:
        cpu: 500m
        memory: 600Mi

grafana:
  enabled: true
  adminUser: admin
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  defaultDashboardsEnabled: true

  nodeSelector:
    kubernetes.io/hostname: ip-192-168-63-213.ap-south-1.compute.internal

  # Avoid running two Grafana instances during an upgrade.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 512Mi

  persistence:
    enabled: false

  service:
    type: ClusterIP

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: ip-192-168-63-213.ap-south-1.compute.internal
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 25Mi
    limits:
      cpu: 100m
      memory: 100Mi
